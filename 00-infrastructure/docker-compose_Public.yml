# eLabFTW - installation locale d'apprentissage (Docker Desktop sous Windows)
# Basé sur le modèle officiel et le guide de passage à la v6 :
#   https://raw.githubusercontent.com/elabftw/elabimg/master/src/docker-compose.yml-EXAMPLE
#   https://doc.elabftw.net/docs/install/upgrade/update-6/
#   https://doc.elabftw.net/docs/install/addons (module OpenCloning)
# Usage : projet portfolio, données fictives uniquement. Pas une installation de production.
#
# VERSION PUBLIQUE : les secrets ont été retirés.
# AVANT DE DÉMARRER, remplace les 3 valeurs marquées "À REMPLACER" :
#   1. A_REMPLACER_SECRET_KEY   -> la clé obtenue sur https://get.elabftw.net/?key
#   2. A_REMPLACER_MDP_BDD      -> le même mot de passe aux 2 endroits (DB_PASSWORD et MYSQL_PASSWORD)
#   3. A_REMPLACER_MDP_ROOT     -> un autre mot de passe (MYSQL_ROOT_PASSWORD)

name: elabftw

networks:
  elabftw-net:

# Volumes gérés par Docker : les données survivent à l'arrêt des conteneurs.
volumes:
  elab-uploads:
  elab-mysql:
  caddy-data:

services:
  web:
    image: elabftw/elabimg:stable
    restart: unless-stopped
    container_name: elabftw
    # eLabFTW 6 : le conteneur tourne avec un utilisateur non-root et un système de fichiers en lecture seule
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /run:mode=755,uid=1000,gid=1000,exec,nosuid,nodev,size=64m
      # Cache d'eLabFTW (temporaire, recréé à chaque démarrage)
      - /var/cache/elabftw:mode=755,uid=1000,gid=1000,nosuid,nodev,size=256m
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=elabftw
      - DB_USER=elabftw
      - DB_PASSWORD=A_REMPLACER_MDP_BDD       # À REMPLACER (identique à MYSQL_PASSWORD)
      - PHP_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - SECRET_KEY=A_REMPLACER_SECRET_KEY     # À REMPLACER (https://get.elabftw.net/?key)
      # Le HTTPS est assuré par le reverse proxy Caddy (service "caddy" plus bas).
      # eLabFTW reçoit du HTTP sur le port 8080, et l'en-tête X-Forwarded-Proto: https envoyé par Caddy.
      - SITE_URL=https://localhost
      - SERVER_NAME=localhost
      - DISABLE_HTTPS=true
      - ENABLE_LETSENCRYPT=false
      # Module "Molecular biology tools" (OpenCloning) : active le menu Tools
      # et indique l'adresse du service opencloning-plugin sur le réseau interne.
      - USE_OPENCLONING=true
      - OPENCLONING_URL=http://opencloning-plugin:8000/
    # Plus de port publié : on passe obligatoirement par Caddy (https://localhost)
    expose:
      - '8080'
    volumes:
      - elab-uploads:/var/lib/elabftw/uploads
    networks:
      - elabftw-net

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    container_name: mysql
    healthcheck:
      test: "/usr/bin/mysql --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute 'SHOW DATABASES;'"
      interval: 5s
      timeout: 5s
      retries: 42
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - SYS_CHROOT
      - SETFCAP
      - NET_RAW
    cap_add:
      - SYS_NICE
    environment:
      - MYSQL_ROOT_PASSWORD=A_REMPLACER_MDP_ROOT   # À REMPLACER
      - MYSQL_DATABASE=elabftw
      - MYSQL_USER=elabftw
      - MYSQL_PASSWORD=A_REMPLACER_MDP_BDD      # À REMPLACER (identique à DB_PASSWORD)
      - TZ=Europe/Paris
    volumes:
      - elab-mysql:/var/lib/mysql
    expose:
      - '3306'
    networks:
      - elabftw-net

  # Reverse proxy : reçoit les connexions HTTPS du navigateur et les transmet à eLabFTW.
  # Il crée lui-même un certificat local ("tls internal") : le navigateur affichera un avertissement, c'est normal.
  caddy:
    image: caddy:2
    restart: unless-stopped
    container_name: caddy
    depends_on:
      - web
    ports:
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - elabftw-net

  # Module OpenCloning (clonage ADN, amorces, séquences).
  # Pas de "ports" : seul eLabFTW lui parle, via le réseau interne elabftw-net.
  opencloning-plugin:
    image: manulera/opencloning:prod-baseurl-opencloning
    container_name: opencloning-plugin
    restart: always
    networks:
      - elabftw-net
